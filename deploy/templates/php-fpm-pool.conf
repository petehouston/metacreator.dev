; MetaCreator.Dev php-fpm pool.
;
; Rendered by deploy/scripts/provision.sh from deploy/templates/php-fpm-pool.conf.
; EDITS HERE ARE OVERWRITTEN by the next provision run — change the template.
;
; This droplet already runs a shared `www` pool plus a dedicated `atxtopeatery`
; pool on PHP __PHP_VERSION__. Adding a third dedicated pool rather than reusing
; `www` buys three things:
;   1. open_basedir below confines these workers to this app's tree, so a PHP
;      process here cannot read another site's .env or database credentials.
;   2. A traffic burst on MetaCreator exhausts its own 8 workers, not the pool
;      the other nine sites share.
;   3. Slow logs, error logs and php.ini overrides are per-app.
;
; Adding a pool does require reloading php__PHP_VERSION__-fpm, which is a
; graceful reload — in-flight requests for the other sites finish normally.

[__FPM_POOL__]

user  = __APP_USER__
group = __APP_GROUP__

listen       = __FPM_SOCKET__
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; ── Process management ───────────────────────────────────────────────────────
; The droplet has 3.9 GB of RAM with roughly 1.7 GB available and ten other
; sites on it. At a 256 MB memory_limit, 8 children is a 2 GB worst case that in
; practice sits far lower, because Laravel requests rarely approach the limit.
; Raise max_children only after watching actual usage — overcommitting here is
; how you push the box into swap and slow down every other site.
pm                   = dynamic
pm.max_children      = 8
pm.start_servers     = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4

; Recycle workers periodically so a slow leak in a dependency cannot accumulate
; over weeks of uptime.
pm.max_requests = 500

; ── Logging ──────────────────────────────────────────────────────────────────
; A backtrace for anything running long — usually an outbound API call against
; a service that stopped responding.
request_slowlog_timeout = 10s
slowlog                 = __SHARED_DIR__/api/storage/logs/php-fpm-slow.log

catch_workers_output          = yes
php_admin_value[error_log]    = __SHARED_DIR__/api/storage/logs/php-fpm-error.log
php_admin_flag[log_errors]    = on

; ── Isolation ────────────────────────────────────────────────────────────────
; Confine this pool to its own tree. /var/www is deliberately NOT on this list:
; that omission is precisely what stops these workers reading the other sites.
; /run/php is absent too — nothing here needs to open another pool's socket.
php_admin_value[open_basedir] = __DEPLOY_ROOT__:/tmp:/usr/share/php:/dev/urandom

; ── Tuning ───────────────────────────────────────────────────────────────────
; Per-pool rather than global, so the other sites keep their own php.ini values.
php_admin_value[memory_limit]        = 256M
php_admin_value[max_execution_time]  = 60
php_admin_value[upload_max_filesize] = 8M
php_admin_value[post_max_size]       = 12M
php_admin_value[date.timezone]       = UTC
php_admin_flag[expose_php]           = off
php_admin_flag[display_errors]       = off

php_admin_flag[session.cookie_httponly]  = on
php_admin_value[session.cookie_samesite] = Lax
php_admin_flag[session.use_strict_mode]  = on

; ── OPcache ──────────────────────────────────────────────────────────────────
; validate_timestamps=0 means PHP never stats a file to check for changes, which
; is the right setting for immutable release directories and a measurable speed
; win. It also means a deploy MUST reset the cache — deploy.sh does that by
; reloading php-fpm after switching the `current` symlink. Without that reload
; the site would keep serving the previous release's code.
php_admin_value[opcache.enable]                  = 1
php_admin_value[opcache.validate_timestamps]     = 0
php_admin_value[opcache.memory_consumption]      = 128
php_admin_value[opcache.interned_strings_buffer] = 16
php_admin_value[opcache.max_accelerated_files]   = 20000
