# MetaCreator.Dev — Horizon's queue dashboard.
#
# Rendered by deploy/scripts/provision.sh from deploy/templates/nginx-horizon.conf.
# EDITS HERE ARE OVERWRITTEN by the next provision run — change the template.
#
# Kept apart from __APP_NAME__-api.conf so that server blocks can opt out.
# nginx does not allow the same `location` twice in one server block, so
# "include the API but not Horizon" has to be expressed by omitting an include,
# not by overriding a location.
#
# The build origin omits it deliberately: a local build (BUILD_MODE in
# deploy/config.sh) forwards that port to a developer's machine over SSH, and a
# connection arriving down a tunnel looks like 127.0.0.1 to nginx — which is
# exactly what the allow-list below trusts. Prerendering only needs /api.
#
# Horizon also gates itself in the application (Horizon::auth). This is the
# second layer: a misconfigured gate should not be one mistake away from a
# publicly readable queue console.
#
# To reach it:
#   ssh -L 8088:127.0.0.1:__NGINX_INTERNAL_PORT__ __SSH_USER__@__SSH_HOST__
#   open http://127.0.0.1:8088/horizon

location ^~ /horizon {
    allow 127.0.0.1;
    deny all;
    try_files $uri /index.php?$query_string;
}

location ^~ /vendor/horizon/ {
    allow 127.0.0.1;
    deny all;
    try_files $uri =404;
}
