# MetaCreator.Dev — the Laravel half of the vhost.
#
# Rendered by deploy/scripts/provision.sh from deploy/templates/nginx-api.conf.
# EDITS HERE ARE OVERWRITTEN by the next provision run — change the template.
#
# Included by all three server blocks in sites-available/__DOMAIN__ (the public
# vhost and the two loopback origins) so there is exactly one definition of how
# a request reaches PHP, rather than three that drift apart.
#
# `root` is set by the including server block, not here: the public vhost and
# the two internal origins point at different release directories.

index index.php;
charset utf-8;

# Uploads. The application caps media at 8 MB; nginx is set slightly higher so
# an over-size upload is rejected by the app with a readable JSON error rather
# than by nginx with a bare 413.
client_max_body_size 12M;

# Laravel's health endpoint, and the API itself.
location = /up {
    try_files $uri /index.php?$query_string;
}

# `^~` stops nginx's search here, so this claims the whole /api/ namespace for
# PHP. The web app also has route handlers under /api/ (apps/web/src/app/api),
# and the public vhost reclaims the ones the browser calls with a *longer* `^~`
# prefix — see the /api/admin/ block in nginx-site.conf. Widening or narrowing
# this line without reading that one is how the admin's Sitemap screen breaks.
location ^~ /api/ {
    try_files $uri /index.php?$query_string;
}

# Sanctum's own routes, which do NOT live under /api/. The SPA primes the CSRF
# cookie with GET /sanctum/csrf-cookie (apps/web/src/lib/client-api.ts) before
# its first write; without this block the request falls through to `location /`
# in nginx-site.conf, reaches Next.js — which has no such route — and comes back
# as Next's 404 page. Writes still worked, because Laravel refreshes XSRF-TOKEN
# on any other stateful response, so the priming failure was silent.
location ^~ /sanctum/ {
    try_files $uri /index.php?$query_string;
}

# Horizon's dashboard lives in its own snippet (__APP_NAME__-horizon.conf),
# included only by the server blocks that should expose it. nginx rejects a
# duplicate `location` within one server block, so a block that must NOT serve
# Horizon simply omits that include rather than trying to override it.

# Uploaded media. FILESYSTEM_DISK=public, so files live in
# shared/api/storage/app/public and are exposed through the public/storage
# symlink that `artisan storage:link` creates in each release.
location ^~ /storage/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    # Never execute anything out of the upload directory, whatever its
    # extension. This is the single most important line in this file.
    location ~ \.php$ { return 403; }
    try_files $uri =404;
}

location ~ ^/index\.php(/|$) {
    fastcgi_pass unix:__FPM_SOCKET__;
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    include fastcgi_params;

    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT   $realpath_root;
    fastcgi_param HTTPS           on;

    # Tool runs can be slow — an image resize or an outbound fetch. The
    # application's own timeout is lower; this is the backstop.
    fastcgi_read_timeout 120s;
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 32k;

    internal;
}

# Only index.php is ever executed. Any other .php file that somehow ends up
# under the document root is served as 404, not run.
location ~ \.php$ {
    return 404;
}

# Dotfiles, except the ACME challenge directory handled on port 80.
location ~ /\.(?!well-known).* {
    deny all;
    access_log off;
    log_not_found off;
}
