# MetaCreator.Dev — vhost.
#
# Rendered by deploy/scripts/provision.sh from deploy/templates/nginx-site.conf.
# EDITS HERE ARE OVERWRITTEN by the next provision run — change the template.
#
# One domain serves both halves of the product: Next.js renders the pages and
# Laravel answers /api/*. There is no api.metacreator.dev, and deliberately so —
# same-origin means Sanctum's cookie authentication needs no CORS preflight and
# no cross-site cookie, which is both simpler and stricter.
#
# ── SAFETY ───────────────────────────────────────────────────────────────────
# This droplet serves ten other sites. Everything in this file is namespaced so
# it cannot collide with them:
#   * `server_name` matches only metacreator.dev and www.metacreator.dev
#   * the rate-limit zone name is prefixed (zone names are global across vhosts)
#   * the SSL session cache name is prefixed (also global)
#   * the loopback ports are ones nothing else was listening on
# No `default_server` anywhere: claiming it would silently steal every request
# with an unrecognised Host header away from whichever site has it today.
# ─────────────────────────────────────────────────────────────────────────────

# Rate limit for the write endpoints, applied at the edge so a flood never
# reaches PHP. The zone name must be unique across the whole nginx config.
limit_req_zone $binary_remote_addr zone=__APP_NAME___write:10m rate=30r/m;

upstream __APP_NAME___next {
    server 127.0.0.1:__WEB_PORT__;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ __WWW_DOMAIN__;

    # Left reachable on port 80 so an ACME HTTP-01 challenge still works if the
    # Cloudflare origin certificate is ever swapped for Let's Encrypt.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

# Canonical host. www redirects to the apex rather than serving a duplicate, so
# there is one URL per page for search engines and one origin for cookies.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __WWW_DOMAIN__;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;

    return 301 https://__DOMAIN__$request_uri;
}

server {
    # `listen ... http2` rather than the standalone `http2 on;` directive: this
    # droplet runs nginx 1.18 and the standalone form only arrived in 1.25.1.
    # Using it here would fail the config test and block a reload for every
    # other site on the box.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL___APP_NAME__:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Restores the visitor's real IP from CF-Connecting-IP. Without it every
    # request appears to come from Cloudflare, so the rate limit above would
    # throttle the entire internet as a single client, and every analytics row
    # would record a Cloudflare edge address.
    include snippets/cloudflare-realip.conf;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/__DOMAIN__.access.log;
    error_log  /var/log/nginx/__DOMAIN__.error.log;

    root __CURRENT_LINK__/api/public;
    include snippets/__APP_NAME__-api.conf;
    include snippets/__APP_NAME__-horizon.conf;

    # ── Next.js route handlers ───────────────────────────────────────────────
    # The web app has a handful of its own endpoints under /api/ (app/api/*),
    # and the browser calls them on this origin like any other page request.
    #
    # `snippets/__APP_NAME__-api.conf` claims `location ^~ /api/` for Laravel.
    # `^~` tells nginx to stop searching once that prefix matches, so *every*
    # /api/* request — including Next's own — was being handed to PHP, which
    # has no such route and answers with its JSON 404 renderer. That is what
    # made /c0ns0le/sitemap show "We could not load this screen": the screen
    # was fetching /api/admin/sitemap and getting Laravel's resource.not_found.
    #
    # A longer `^~` prefix beats a shorter one, which is what reclaims this
    # namespace without touching the shared snippet. Laravel's own admin API is
    # at /api/v1/admin (routes/api_v1.php), so /api/admin cannot collide with
    # it — this prefix belongs to Next alone, and any future route handler the
    # admin calls should be added underneath it.
    location ^~ /api/admin/ {
        proxy_pass http://__APP_NAME___next;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # The refresh action re-renders /sitemap.xml before it answers, so this
        # one is slower than a page render and must not be cut off mid-flight.
        proxy_read_timeout 120s;
        proxy_buffering on;
    }

    # Tool runs and auth endpoints, rate limited at the edge. `burst` absorbs a
    # legitimate double-click; `nodelay` serves the burst immediately rather
    # than queuing it, so a real user never waits.
    location ~ ^/api/v1/(tools/[^/]+/run|auth/) {
        limit_req zone=__APP_NAME___write burst=10 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Everything that is not the API is a page, and pages are Next.js.
    location / {
        proxy_pass http://__APP_NAME___next;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    # Next's build-hashed assets are immutable by construction: a change to the
    # file changes its name. A year of browser caching is safe and is what the
    # framework expects.
    location /_next/static/ {
        proxy_pass http://__APP_NAME___next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ── Internal origins ─────────────────────────────────────────────────────────
# Next.js Server Components call the API server-side. They do that through
# nginx on loopback rather than over the public hostname because a request to
# https://metacreator.dev from the droplet itself would leave for Cloudflare and
# come back — two extra network hops and a dependency on the edge being up for
# a page to render at all.
#
# These blocks answer /api/*, /up and /storage/* only. They deliberately do NOT
# proxy to Next.js: an internal origin that forwarded page requests back to the
# renderer that called it would be a request loop.

server {
    listen 127.0.0.1:__NGINX_INTERNAL_PORT__;
    server_name _;

    root __CURRENT_LINK__/api/public;
    include snippets/__APP_NAME__-api.conf;
    # Horizon is reachable here — this is the port the SSH tunnel in
    # deploy/README.md forwards for the dashboard.
    include snippets/__APP_NAME__-horizon.conf;

    location / { return 404; }
}

# Build-time origin, serving the release currently being assembled rather than
# the live one. `next build` prerenders pages by calling the API, and it must
# call the API *of the release it is building*: on a first deploy `current` does
# not exist yet, and on every later one it still points at the previous release,
# so the build would otherwise prerender against the old API contract.
#
# deploy.sh points `building` at the new release before running the build.
server {
    listen 127.0.0.1:__NGINX_BUILDING_PORT__;
    server_name _;

    root __BUILDING_LINK__/api/public;
    include snippets/__APP_NAME__-api.conf;
    # NOTE: __APP_NAME__-horizon.conf is deliberately NOT included here.
    # A local build forwards this port to the developer's machine over SSH, and
    # nginx sees a tunnelled connection as 127.0.0.1 — the very address the
    # Horizon snippet trusts. Prerendering only needs /api, so the queue console
    # simply does not exist on this port.

    location / { return 404; }
}
