# Production inventory.
#
# `ansible_host` is the droplet's public IP. Everything else is derived, so adding a
# second app node later means adding one entry here — not editing the playbooks.
all:
  children:
    app:
      hosts:
        metacreator-prod-1:
          ansible_host: 203.0.113.10
    db:
      hosts:
        metacreator-prod-1:
    workers:
      hosts:
        metacreator-prod-1:

  vars:
    ansible_user: deploy
    ansible_python_interpreter: /usr/bin/python3

    env_name: production
    app_domain: metacreator.dev
    api_domain: api.metacreator.dev
    app_url: "https://{{ app_domain }}"
    api_url: "https://{{ api_domain }}"

    git_repo: git@github.com:metacreator/metacreator.dev.git
    git_ref: main

    deploy_root: /var/www/metacreator
    keep_releases: 5

    php_version: "8.4"
    node_version: 20
    mysql_version: "8.4"

    # Only one host may run the scheduler, and only one may run migrations.
    is_primary: true
