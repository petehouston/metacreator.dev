---
- name: Install the Go toolchain
  ansible.builtin.apt:
    name: golang-go
    state: present

- name: Build the compute binary
  ansible.builtin.command:
    cmd: go build -trimpath -ldflags="-s -w" -o {{ release_path }}/bin/compute ./cmd/compute
    chdir: "{{ release_path }}/apps/compute"
  environment:
    CGO_ENABLED: "0"
    GOCACHE: /tmp/go-build
  changed_when: true

- name: Install the systemd unit
  become_user: root
  ansible.builtin.template:
    src: metacreator-compute.service.j2
    dest: /etc/systemd/system/metacreator-compute.service
    mode: "0644"
  notify: restart compute

- name: Enable the compute service
  become_user: root
  ansible.builtin.systemd:
    name: metacreator-compute
    enabled: true
    state: started
    daemon_reload: true
