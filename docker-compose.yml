name: metacreator

x-api-base: &api-base
  build:
    context: .
    dockerfile: docker/api/Dockerfile
    target: dev
  volumes:
    - ./apps/api:/app:cached
    - api-vendor:/app/vendor
  environment: &api-env
    APP_ENV: local
    APP_DEBUG: "true"
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${MYSQL_DATABASE:-metacreator}
    DB_USERNAME: ${MYSQL_USER:-metacreator}
    DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    COMPUTE_URL: http://compute:8090
    AWS_ENDPOINT: http://minio:9000
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
    AWS_BUCKET: ${MEDIA_BUCKET:-metacreator-media}
    AWS_USE_PATH_STYLE_ENDPOINT: "true"
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ── Frontend ────────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: dev
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app:cached
      - web-node-modules:/app/node_modules
      - web-next:/app/.next
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:${WEB_PORT:-3000}
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8080}
      API_INTERNAL_URL: http://api:8080
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-local-revalidate-secret}
    depends_on:
      api:
        condition: service_healthy
    command: npm run dev

  # ── Backend ─────────────────────────────────────────────────────────────────
  api:
    <<: *api-base
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      <<: *api-env
      # Only the api container migrates, so workers never race the schema.
      RUN_MIGRATIONS: "true"
    command: php artisan serve --host=0.0.0.0 --port=8080
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  worker:
    <<: *api-base
    # Waits for api so composer install and migrations finish first.
    depends_on:
      api:
        condition: service_healthy
    command: php artisan horizon

  scheduler:
    <<: *api-base
    depends_on:
      api:
        condition: service_healthy
    command: php artisan schedule:work

  # ── Go compute service ──────────────────────────────────────────────────────
  compute:
    build:
      context: .
      dockerfile: docker/compute/Dockerfile
      target: dev
    ports:
      - "${COMPUTE_PORT:-8090}:8090"
    volumes:
      - ./apps/compute:/app:cached
      - compute-cache:/go/pkg/mod
    environment:
      COMPUTE_ADDR: ":8090"
      COMPUTE_SHARED_SECRET: ${COMPUTE_SHARED_SECRET:-local-compute-secret}

  # ── Data ────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-metacreator}
      MYSQL_USER: ${MYSQL_USER:-metacreator}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --sql-mode=STRICT_ALL_TABLES,NO_ENGINE_SUBSTITUTION
      - --innodb-buffer-pool-size=512M
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Dev services ────────────────────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "1025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_UI_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the media bucket on first boot, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minio123} &&
      mc mb --ignore-existing local/${MEDIA_BUCKET:-metacreator-media} &&
      mc anonymous set download local/${MEDIA_BUCKET:-metacreator-media} &&
      echo 'MinIO bucket ready'
      "
    restart: "no"

volumes:
  mysql-data:
  redis-data:
  minio-data:
  api-vendor:
  web-node-modules:
  web-next:
  compute-cache:
