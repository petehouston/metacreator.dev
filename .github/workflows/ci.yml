name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, analyse, test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: metacreator_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, redis, intl, bcmath, gd, zip
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('apps/api/composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Formatting (Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (PHPStan level 8)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Migration round-trip
        # A migration without a working down() cannot be rolled back in an incident,
        # which is exactly when you need it (docs/04).
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: metacreator_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan migrate --force
          php artisan db:seed --class=Database\\Seeders\\ProductionSeeder --force
          php artisan migrate:rollback --force

      - name: Tests
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: metacreator_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --parallel

      - name: Dependency audit
        run: composer audit --abandoned=report

  web:
    name: Web — lint, types, test, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test:run

      - name: Build
        env:
          NEXT_PUBLIC_APP_URL: https://metacreator.dev
          NEXT_PUBLIC_API_URL: https://api.metacreator.dev
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

  compute:
    name: Compute — vet, test, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/compute

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: apps/compute/go.sum

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath ./...

  ansible:
    name: Ansible — syntax check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ansible-core ansible-lint

      - name: Syntax check every playbook
        working-directory: deploy/ansible
        run: |
          ansible-galaxy collection install community.general community.mysql ansible.posix
          # Vault variables are absent in CI, so stub the file the playbooks load.
          cp group_vars/all/vault.yml.example group_vars/all/vault.yml
          for playbook in provision.yml deploy.yml rollback.yml; do
            ansible-playbook --syntax-check -i inventories/staging/hosts.yml "$playbook"
          done
